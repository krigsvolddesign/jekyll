<ul class="example-documentation-paths">{% for item in include.items %}<li><div class="example-documentation-paths__scope">{% if item.image %}<img src="{{ item.image | relative_url | escape }}" alt="{{ item.alt | escape }}" width="720" height="480" loading="lazy">{% endif %}<h3><a href="{% include examples/url.html url=item.url %}">{{ item.title | escape }}</a></h3></div><p>{{ item.summary | escape }}</p></li>{% endfor %}</ul>
