{% if page.show_toc == true %}{% assign contents = page.toc | default: include.record.sections %}{% if contents.size > 0 %}<nav class="example-local-index" aria-label="{{ include.label | default: 'On this page' | escape }}"><p class="eyebrow">On this page</p><ol>{% for block in contents %}<li><a href="#{{ block.id | escape }}">{{ block.title | escape }}</a></li>{% endfor %}</ol></nav>{% endif %}{% endif %}
