<div class="example-component-register">{% for block in include.record.sections %}<section class="example-section example-component-register__entry" aria-labelledby="{{ block.id | escape }}"><header class="example-component-register__scope"><h2 id="{{ block.id | escape }}">{{ block.title | escape }}</h2></header><div class="example-section__body"><div class="example-prose">{{ block.body | markdownify | escape | nightjar_sanitize: site.baseurl }}</div></div></section>{% endfor %}</div>
